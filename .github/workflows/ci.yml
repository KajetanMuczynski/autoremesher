# SPDX-License-Identifier: GPL-3.0-or-later
# Every check a change to master must pass, in one workflow, so one job ("CI passed") can
# stand for all of them in branch protection. It runs on every pull request (any base
# branch), on pushes to master and tags, and by hand (Actions > ci > Run workflow) for a
# branch without a PR. What ships is the Blender add-on: the job "addon" builds, tests and
# uploads its zips (Windows and macOS; Linux users build their own, see addon/README.md).
#
# GitHub starts no pull_request run while a PR has merge conflicts, so a conflicted PR
# shows "CI passed" as missing, never as green.
name: ci

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

# Read-only token for every job; nothing here writes to the repo (artifacts and caches
# don't need token scopes).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: format (clang-format 23)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Pinned: clang-format releases disagree on some layouts, so "latest" can turn a
      # formatted tree red. Bump deliberately, together with any reformat it needs.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install clang-format==23.1.3
      - name: Run clang-format
        run: sh ci/lint.sh
      - name: Check for changes
        run: git diff --ignore-space-at-eol --exit-code

  # The core tests and the output gate, on the same Release build of autoremesher_core.
  # macOS runs it because the shipped DMG builds there with Apple clang and nothing else
  # on a PR does; Windows builds the core in the addon job.
  core:
    name: core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y cmake libtbb-dev
          else
            brew install tbb
          fi
      - name: Build the core, CLI and tests
        run: |
          cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release -DAUTOREMESHER_BUILD_TESTS=ON
          cmake --build build/core --parallel 4
      # --no-tests=error: a configuration that registers no tests fails instead of passing.
      # A registered test whose executable is missing fails as "Not Run".
      - name: Core tests
        run: ctest --test-dir build/core --output-on-failure --no-tests=error
      - name: Output gate
        run: python3 ci/output_gate.py build/core/autoremesher-cli build/gate
      - name: Upload gate output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-output-${{ matrix.name }}
          path: build/gate/
          if-no-files-found: ignore

  # The Qt app (qmake) and the ar_bench driver, each smoke-tested on a sphere.
  qt-app:
    name: qt-app (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake qt5-qmake qtbase5-dev libqt5opengl5-dev qttools5-dev-tools \
            libqt5svg5-dev libtbb-dev libgl1-mesa-dev
          g++ --version | head -n 1; qmake --version | tail -n 1; cmake --version | head -n 1

      - name: Build Qt app
        run: |
          mkdir -p build/app
          cd build/app
          qmake ../../autoremesher.pro
          make -j"$(nproc)"

      - name: Build Qt-free core (ar_bench)
        run: |
          cmake -S tools/bench/bench -B build/core -DAR_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build/core -j"$(nproc)"

      - name: Smoke test, Qt app headless
        run: ci/smoke_test.sh build/app/autoremesher build/smoke-app

      - name: Smoke test, core
        run: ci/smoke_test.sh build/core/ar_bench build/smoke-core

      - name: Upload smoke test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-output
          path: |
            build/smoke-app/
            build/smoke-core/
          if-no-files-found: ignore

  # The Qt-free CLI (autoremesher-cli) and the Blender add-on on Linux, Windows and
  # macOS: build the CLI with CMake, run the add-on's worker tests against it, package
  # the extension zip with the CLI bundled, install that zip into a real Blender
  # and remesh a sphere through it in background mode.
  # The Windows and macOS zips are self-contained (static oneTBB, no DLLs or dylibs
  # outside the OS) and uploaded as the artifacts addon-windows-x64 and addon-macos-arm64.
  # The Linux one links the runner's libtbb and glibc, so it is tested, not shipped.
  addon:
    name: addon (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux checks the oldest Blender the manifest allows, Windows and macOS a
          # current release (what a new install gets).
          - os: ubuntu-24.04
            platform: linux-x64
            blender: 4.2.23
            blender_file: blender-4.2.23-linux-x64.tar.xz
            blender_sha256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
          - os: windows-latest
            platform: windows-x64
            blender: 5.2.2
            blender_file: blender-5.2.2-windows-x64.zip
            blender_sha256: 3849d17a682cba006075aaa3f3597ecb5c9c30ec31035b2e092c53e40679b535
            ship: true
          # Apple silicon only (GitHub's Intel macOS runners are being retired). Static
          # oneTBB, and macOS 11.2 as the oldest target, the minimum of Blender 4.2.
          - os: macos-latest
            platform: macos-arm64
            blender: 5.2.2
            blender_file: blender-5.2.2-macos-arm64.dmg
            blender_sha256: dc4125399b8bfefe283cc1624d6cfc7809d1cac20ace51072127eb371f31f210
            cmake_args: -DAUTOREMESHER_BUNDLED_TBB=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.2
            ship: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      CMAKE_ARGS: ${{ matrix.cmake_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pefile
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            # libtbb-dev for the build; the X and GL libraries Blender links even in background mode.
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libtbb-dev \
              libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
          fi
          cmake --version | head -n 1

      # Windows: oneTBB is built from source and linked statically, with the
      # static C++ runtime (/MT); see CMakeLists.txt. macOS: static oneTBB too
      # (CMAKE_ARGS from the matrix).
      - name: Build autoremesher-cli
        run: |
          # shellcheck disable=SC2086  # CMAKE_ARGS holds several arguments
          cmake -S . -B build/cli -DCMAKE_BUILD_TYPE=Release $CMAKE_ARGS
          cmake --build build/cli --config Release --parallel 4
          cmake --install build/cli --config Release --prefix build/cli-install
          ls -l build/cli-install/bin build/cli-install/licenses
          cli=build/cli-install/bin/autoremesher-cli
          if [ "$RUNNER_OS" = Windows ]; then cli="$cli.exe"; fi
          echo "CLI=$cli" >> "$GITHUB_ENV"

      - name: Check the DLLs it needs
        if: runner.os == 'Windows'
        run: python ci/check_dll_imports.py "$CLI"

      # Only macOS's own libraries, and the deployment target the matrix asks for.
      - name: Check the libraries it needs
        if: runner.os == 'macOS'
        run: |
          otool -L "$CLI"
          if otool -L "$CLI" | awk 'NR > 1 { print $1 }' | grep -v -E '^(/usr/lib/|/System/)'; then
            echo "ERROR: $CLI links libraries outside macOS"; exit 1
          fi
          minos=$(otool -l "$CLI" | awk '$1 == "minos" { print $2; exit }')
          echo "minimum macOS: $minos"
          [ "$minos" = 11.2 ] || { echo "ERROR: expected minimum macOS 11.2"; exit 1; }

      - name: CLI arguments
        run: |
          "$CLI" --version
          "$CLI" --help
          status=0; "$CLI" --target-quads 10 || status=$?
          [ "$status" = 1 ] || { echo "expected exit status 1 without --input, got $status"; exit 1; }

      # Includes the 16k-triangle sphere remesh (1,200-2,400 quads for a target
      # of 2,000), cancel through stdin and a temporary folder with non-ASCII
      # characters in its path.
      - name: Worker tests
        run: |
          export AUTOREMESHER_EXECUTABLE="$CLI"
          python -m unittest discover -s addon/tests -v

      - name: Package the extension
        id: package
        run: |
          zip=$(python addon/package.py --cli-prefix build/cli-install --platform ${{ matrix.platform }})
          python -c "import sys, zipfile; [print(i.filename, i.file_size) for i in zipfile.ZipFile(sys.argv[1]).infolist()]" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Cache Blender ${{ matrix.blender }}
        id: blender-cache
        # Safe on tag runs too: only the test Blender is cached, and it is checked by
        # SHA-256 below before use; nothing from the cache goes into the zip.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: blender-download/${{ matrix.blender_file }}
          key: ${{ matrix.blender_file }}

      - name: Download Blender ${{ matrix.blender }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          series=$(echo "${{ matrix.blender }}" | cut -d. -f1-2)
          mkdir -p blender-download
          curl -fsSL --retry 3 -o "blender-download/${{ matrix.blender_file }}" \
            "https://download.blender.org/release/Blender$series/${{ matrix.blender_file }}"

      # Checked on every run, cached or not, against the sum in blender-<version>.sha256
      # next to the download (copied into the matrix when the version is bumped).
      - name: Verify Blender ${{ matrix.blender }}
        run: |
          sum="${{ matrix.blender_sha256 }}  blender-download/${{ matrix.blender_file }}"
          if command -v sha256sum > /dev/null; then echo "$sum" | sha256sum -c -
          else echo "$sum" | shasum -a 256 -c -; fi

      - name: Unpack Blender
        run: |
          mkdir -p blender
          case "${{ matrix.blender_file }}" in
            *.zip) 7z x -y -oblender "blender-download/${{ matrix.blender_file }}" > /dev/null ;;
            *.dmg)
              hdiutil attach -nobrowse -readonly -mountpoint "$PWD/blender-dmg" \
                "blender-download/${{ matrix.blender_file }}" > /dev/null
              cp -R blender-dmg/Blender.app blender/
              hdiutil detach "$PWD/blender-dmg" > /dev/null ;;
            *) tar -xJf "blender-download/${{ matrix.blender_file }}" -C blender ;;
          esac
          if [ "$RUNNER_OS" = macOS ]; then exe=blender/Blender.app/Contents/MacOS/Blender
          else exe=$(find blender -maxdepth 2 -type f \( -name blender.exe -o -name blender \) | head -n 1); fi
          echo "BLENDER=$PWD/$exe" >> "$GITHUB_ENV"

      # Installs the zip the way "Install from Disk..." does, then runs the
      # installed copy with its bundled remesher (no AUTOREMESHER_EXECUTABLE).
      - name: Install the zip in Blender and remesh
        run: |
          "$BLENDER" --version | head -n 1
          "$BLENDER" --command extension validate "${{ steps.package.outputs.zip }}"
          "$BLENDER" --command extension install-file -r user_default -e "${{ steps.package.outputs.zip }}"
          "$BLENDER" -b --factory-startup --python-exit-code 1 \
            --python addon/tests/blender_smoke.py -- --installed

      - name: Upload the extension zip
        if: matrix.ship
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-${{ matrix.platform }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  # The one check branch protection requires. Green only when every job above
  # succeeded: a failed, cancelled or skipped job turns it red.
  ci-passed:
    name: CI passed
    if: always()
    needs: [format, core, qt-app, addon]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {job: r["result"] for job, r in json.load(sys.stdin).items() if r["result"] != "success"}
          for job, result in sorted(bad.items()):
              print("%s: %s" % (job, result))
          sys.exit(1 if bad else 0)'
