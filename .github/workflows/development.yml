name: development

on:
  push:
    branches:
      - master
      - ci
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  clang-format-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          brew update
          brew install clang-format
      - name: Run clang-format
        run: cd ${GITHUB_WORKSPACE}/ci && sh ./lint.sh && cd ${GITHUB_WORKSPACE}
      - name: Check for changes
        run: |
          if ! git diff --ignore-space-at-eol --exit-code; then
            exit 1
          fi

  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libtbb-dev
      - name: Build the core tests
        run: |
          cmake -S . -B build-tests -DAUTOREMESHER_BUILD_TESTS=ON
          cmake --build build-tests -j"$(nproc)"
      - name: Run the core tests
        run: ctest --test-dir build-tests --output-on-failure
