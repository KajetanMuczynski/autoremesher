name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake qt5-qmake qtbase5-dev qttools5-dev-tools libqt5svg5-dev \
            libtbb-dev libgl1-mesa-dev
          g++ --version | head -n 1; qmake --version | tail -n 1; cmake --version | head -n 1

      - name: Build Qt app
        run: |
          mkdir -p build/app
          cd build/app
          qmake ../../autoremesher.pro
          make -j"$(nproc)"

      - name: Build Qt-free core (ar_bench)
        run: |
          cmake -S tools/bench/bench -B build/core -DAR_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build/core -j"$(nproc)"

      - name: Smoke test, Qt app headless
        run: ci/smoke_test.sh build/app/autoremesher build/smoke-app

      - name: Smoke test, core
        run: ci/smoke_test.sh build/core/ar_bench build/smoke-core

      - name: Upload smoke test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: |
            build/smoke-app/
            build/smoke-core/
          if-no-files-found: ignore
